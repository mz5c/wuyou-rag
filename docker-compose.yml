version: '3.8'

services:
  mysql:
    image: mysql:8.0
    restart: always
    container_name: wy-rag-mysql
    hostname: mysql_host
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456abc
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
#      - ./rag-bootstrap/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.0.12
    restart: always
    container_name: wy-rag-redis
    hostname: redis_host
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --requirepass 123456abc
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456abc", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.8.26-management
    restart: always
    container_name: wy-rag-rabbitmq
    hostname: rabbitmq_host
    volumes:
      - 'rabbitmq_data:/var/lib/rabbitmq'
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: 123456abc
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: wy-rag-etcd
    hostname: etcd_host
    restart: always
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd --advertise-client-urls http://0.0.0.0:2379 --listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 10s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: wy-rag-minio
    hostname: minio_host
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: 123456abc
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: wy-rag-milvus
    hostname: milvus_host
    restart: always
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: ["milvus", "run", "standalone"]
    volumes:
      - milvus_data:/var/lib/milvus
      - ./milvus.yaml:/milvus/configs/milvus.yaml
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  elasticsearch:
    build: ./docker/elasticsearch
    container_name: wy-rag-es
    hostname: es_host
    restart: always
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - ingest.geoip.downloader.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  attu:
    image: zilliz/attu:v2.4
    container_name: wy-rag-attu
    hostname: attu_host
    restart: always
    depends_on:
      milvus:
        condition: service_healthy
    ports:
      - '3000:3000'

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  etcd_data:
  milvus_data:
  es_data:
