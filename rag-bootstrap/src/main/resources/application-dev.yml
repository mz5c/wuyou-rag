spring:
  datasource:
    url: jdbc:mysql://localhost:3306/wy_rag?serverTimezone=UTC&useSSL=false&useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&failOverReadOnly=false
    username: root
    password: 123456abc
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      continue-on-error: true
  data:
    redis:
      host: localhost
      port: 6379
      password: 123456abc
      database: 0
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: 123456abc
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.wuyou.rag.entity
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: d2VicHJvdGVjdC1yYWctc2VjcmV0LWtleS0yMDI0LXd5cmFnLXNlY3JldA==
  expiration-ms: 86400000

minio:
  endpoint: http://localhost:9000
  access-key: admin
  secret-key: 123456abc
  bucket: wy-rag-docs

resilience4j:
  circuitbreaker:
    circuit-breaker-aspect-order: 2
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
    instances:
      llmService:
        base-config: default
  retry:
    retry-aspect-order: 3
    configs:
      default:
        max-attempts: 3
        wait-duration: 2s
        exponential-backoff-multiplier: 2
    instances:
      llmService:
        base-config: default
  ratelimiter:
    rate-limiter-aspect-order: 1
    configs:
      default:
        limit-for-period: 10
        limit-refresh-period: 1m
        timeout-duration: 5s
    instances:
      llmService:
        base-config: default

llm:
  api-url: ${WY_LLM_API_URL}
  api-key: ${WY_LLM_API_KEY}
  model-name: ${WY_LLM_API_MODEL}